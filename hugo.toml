# 데이터 인사이트랩 (Data Insight Lab) 홈페이지 설정
baseURL = 'https://di-lab.io/'
languageCode = 'ko-KR'
title = '데이터 인사이트랩 | Data Insight Lab'
# theme 미사용 (커스텀 layouts 직접 구성)

# 태그·카테고리 미사용 (taxonomy 템플릿 경고 방지)
disableKinds = ['taxonomy', 'term']

# robots.txt 생성 (layouts/robots.txt 템플릿 사용)
enableRobotsTXT = true

# sitemap lastmod 를 git 커밋 시각에서 (배포 워크플로 checkout fetch-depth: 0 전제)
enableGitInfo = true

[params]
  description = '데이터 분석 · AI/ML 모델링 · 컨설팅 전문 기업'
  name_en = 'Data Insight Lab'      # 영문 상호 (구조화 데이터 alternateName)
  email = 'yhkim@di-lab.io'
  phone = '010-8630-5881'
  # Web3Forms 폼 전송 키 (공개되어도 무방 — 수신 주소 매핑용)
  web3formsKey = 'c145dadc-2792-43b0-bd01-9bd182b2af30'

# 검색엔진 소유 확인 — 값이 비어 있으면 메타 태그를 출력하지 않음
[params.verify]
  google = ""
  naver = ""

# 실적 숫자 단일 소스 (완료 건수 합계를 10단위 내림, 집계 근거는 NOTES.md)
[params.stats]
  projects_count = 50

# 신뢰 스트립(홈 hero 아래) 값 — 건수는 [params.stats] projects_count 재사용
[params.trust]
  reply_days = 3                  # 영업일 기준 회신 기한 (문의 페이지 "영업일 3일 이내" 와 동일하게 유지)
  certs_count = 4                 # 공공조달 인증·확인서 보유 수 (여성기업·중소기업·SW사업자·창업기업)
  tools = "R · Python · SAS"      # 주력 도구

# 푸터 사업자 정보 (소재지는 동 단위 표기 유지 — 상세 주소 추가 금지)
[params.business]
  name = '데이터 인사이트랩'
  owner = '김영혜'
  regNo = '746-12-02956'
  address = '서울특별시 송파구'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
