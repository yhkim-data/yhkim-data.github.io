# 자주 묻는 질문 — 홈 FAQ·문의 페이지 공용 (사이트에 공개된 사실만, 확인 필요 정책은 로컬 FAQ_REVIEW.md)
# 값 연동 주의: 회신 기한·인증 수는 hugo.toml [params.trust], 서비스별 기간·산출물은 content/services/index.md 와 같게 유지.
- q: "문의하면 언제까지 회신을 받을 수 있나요?"
  a: "문의 후 영업일 3일 이내에 분석 방법과 견적을 회신합니다. 문의는 폼 또는 이메일(yhkim@di-lab.io)로 가능합니다."

- q: "프로젝트는 어떤 순서로 진행되나요?"
  a: "Diagnose(분석 가능성 진단), Design(방법론·산출물 기준 설계), Model(분석·모델링 수행), Deliver(검증 후 보고서·데이터셋 전달)의 4단계로 진행합니다."

- q: "일부 단계만 의뢰할 수도 있나요?"
  a: "가능합니다. 설문 한 건의 통계 검정부터 데이터 파이프라인 구축까지, 과업 범위에 맞는 영역만 선택해 의뢰할 수 있습니다."

- q: "서비스별 소요 기간은 어느 정도인가요?"
  a: "데이터 분석 2\\~6주, AI/ML 모델링 4\\~10주, 데이터 컨설팅 2\\~4주, 통계 조사 분석 4\\~8주, 데이터 구축 3\\~8주가 통상 범위입니다. 소프트웨어 개발은 규모별로 협의(통상 6주\\~)하며, 모든 기간은 과업 범위 확정 후 조정합니다."

- q: "산출물은 어떤 형식으로 받게 되나요?"
  a: "보고서는 PDF·HWP, 결과표는 XLSX, 데이터는 CSV·DB, 코드는 R·Python(Git)으로 전달합니다. 모델링은 모델 파일(pkl·onnx)과 성능 평가 보고서를 포함합니다."

- q: "어떤 분석 도구를 사용하나요?"
  a: "R, Python, SAS 기반의 통계 분석과 XGBoost·Random Forest·딥러닝·자연어 처리 등의 모델링을 수행합니다. 모든 분석은 재현 가능한 코드와 문서로 남깁니다."

- q: "문의 시 제출한 개인정보는 얼마나 보관되나요?"
  a: "이름·소속·이메일·연락처를 문의 응대와 견적 안내 목적으로만 수집하며, 처리 완료 후 1년간 보관한 뒤 지체 없이 파기합니다. 자세한 내용은 [개인정보처리방침](/privacy/)에서 확인할 수 있습니다."

- q: "공공기관과는 어떤 방식으로 계약할 수 있나요?"
  a: "여성기업·중소기업·SW사업자·창업기업 확인 등 공공조달 인증 4종을 보유하고 나라장터 등록을 마쳐, 수의계약과 경쟁입찰에 모두 참여할 수 있습니다."
