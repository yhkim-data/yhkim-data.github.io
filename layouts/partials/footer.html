<!-- 사이트 푸터 -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <strong>데이터 인사이트랩</strong>
        <span>Data Insight Lab</span>
      </div>
      <div class="footer-contact">
        <a href="mailto:yhkim@di-lab.io">yhkim@di-lab.io</a>
        <span class="footer-divider">|</span>
        <a href="tel:010-8630-5881">010-8630-5881</a>
      </div>
    </div>
    {{ with .Site.Params.business }}
    <p class="footer-business">
      <span>{{ .name }}</span>
      <span>대표: {{ .owner }}</span>
      <span>사업자등록번호: {{ .regNo }}</span>
      <span>{{ .address }}</span>
      <span><a href="mailto:{{ $.Site.Params.email }}">{{ $.Site.Params.email }}</a></span>
    </p>
    {{ end }}
    <p class="footer-copyright">&copy; {{ now.Year }} 데이터 인사이트랩. All rights reserved.</p>
  </div>
</footer>
